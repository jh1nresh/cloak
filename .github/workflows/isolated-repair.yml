name: Isolated public repair verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: isolated-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reject incident loader before dependency installation
        run: python3 .github/scripts/check-incident-loader.py
      - name: Verify public source with bounded font connections
        env:
          PUBLIC_SOURCE: 'true'
        run: python3 .github/scripts/run-isolated-font-check.py
